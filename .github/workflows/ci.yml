# Back-end gate (BUILD_PLAN §10.3). The e2e, security, trace and deploy jobs arrive
# with the web app and staging.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      # Format, lint, typecheck, module boundaries, code rules, migrations check.
      - run: uv run python -m scripts.verify --static

  integration:
    name: integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: as_owner
          POSTGRES_PASSWORD: as_owner
          POSTGRES_DB: as_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U as_owner -d as_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://as_owner:as_owner@localhost:5432/as_test
      PGPASSWORD: as_owner
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      # The same role setup the local compose file runs (infra/postgres/init).
      - name: Create the as_app role
        run: |
          for f in ../infra/postgres/init/*.sql; do
            psql -h localhost -U as_owner -d as_test -v ON_ERROR_STOP=1 -f "$f"
          done
      - run: uv run pytest --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-backend
          path: backend/coverage.xml
