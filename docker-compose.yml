services:
  postgres-test:
    image: postgres:17
    environment:
      POSTGRES_USER: as_owner
      POSTGRES_PASSWORD: as_owner
      POSTGRES_DB: as_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U as_owner -d as_test"]
      interval: 2s
      timeout: 3s
      retries: 15
